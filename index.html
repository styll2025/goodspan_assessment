<title>Find Your Good Span</title>
<style>

/* Layout: one centred column (max 1080px); bands alternate cream / light blue / plum, as on the website. */
@font-face{font-family:"BST Bazaine";src:url("design/assets/BSTBazaineTrial-Thin.otf") format("opentype");font-weight:200;font-display:swap}
@font-face{font-family:"BST Bazaine";src:url("design/assets/BSTBazaineTrial-Light.otf") format("opentype");font-weight:300;font-display:swap}
@font-face{font-family:"BST Bazaine";src:url("design/assets/BSTBazaineTrial-Regular.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Archivo";src:url("design/assets/Archivo-Regular.ttf") format("truetype");font-weight:400;font-display:swap}
:root{
  --plum:#4d2831;--cream:#fff2ea;--orange:#fe600c;--light-blue:#d1e6e9;--pink:#f5a4c2;--ochre:#cb863a;--black:#000;
  --surface:var(--cream);--surface-alt:var(--light-blue);--surface-inverse:var(--plum);
  --ink:var(--plum);--ink-muted:#7a5a5f;--ink-on-alt:var(--plum);--ink-inverse:var(--light-blue);
  --line:var(--plum);--focus:var(--plum);--button-fill:var(--plum);--button-ink:var(--cream);
  --font-display:"BST Bazaine","Helvetica Neue",Arial,sans-serif;--font-ui:Archivo,"Helvetica Neue",Arial,sans-serif;
  --radius-card:40px;--radius-pill:999px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--surface:var(--plum);--surface-inverse:var(--cream);--ink:var(--light-blue);--ink-muted:#b0b6bb;--ink-inverse:var(--plum);--line:var(--cream);--focus:var(--light-blue);--button-fill:var(--light-blue);--button-ink:var(--plum);color-scheme:dark}}
:root[data-theme="dark"]{--surface:var(--plum);--surface-inverse:var(--cream);--ink:var(--light-blue);--ink-muted:#b0b6bb;--ink-inverse:var(--plum);--line:var(--cream);--focus:var(--light-blue);--button-fill:var(--light-blue);--button-ink:var(--plum);color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--surface);color:var(--ink);font-family:var(--font-display);font-weight:300;font-size:18px;line-height:24px}
.wrap{max-width:1080px;margin:0 auto;padding-inline:clamp(16px,5vw,72px)}
.ui{font-family:var(--font-ui);font-size:13px;line-height:16px;letter-spacing:.03em;text-transform:uppercase}
.kicker{font-size:18px;letter-spacing:.04em;text-transform:uppercase;margin:0}
h1,h2,h3{font-weight:300;margin:0;text-wrap:balance}
h1{font-weight:200;font-size:clamp(44px,7vw,68px);line-height:1.08;letter-spacing:-.04em}
h2{font-size:clamp(30px,4vw,40px);line-height:1.1;letter-spacing:-.015em}
h3{font-size:22px;line-height:28px}
p{margin:0}
.muted{color:var(--ink-muted)}
a,button,select{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;padding-block:28px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-size:22px;font-weight:300}
.picker{display:flex;flex-wrap:wrap;gap:8px}
.picker button{font-family:var(--font-ui);font-size:13px;letter-spacing:.03em;text-transform:uppercase;height:36px;padding:0 16px;border-radius:var(--radius-pill);border:1px solid var(--line);background:transparent;cursor:pointer}
.picker button[aria-pressed="true"]{background:var(--button-fill);color:var(--button-ink);border-color:var(--button-fill)}
.note-ex{padding-block:12px 0}

section{padding-block:clamp(48px,8vw,96px)}
.hero{display:grid;gap:32px;padding-block:clamp(48px,8vw,96px) 40px}
.hero .lead{font-size:20px;line-height:30px;max-width:640px}

/* journey */
.journey{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;list-style:none;margin:0;padding:0}
.journey li{display:grid;gap:12px;align-content:start}
.pill{display:inline-flex;align-items:center;justify-content:center;width:60px;height:34px;border-radius:var(--radius-pill);font-family:var(--font-ui);font-size:11px;color:var(--black)}
.journey li:nth-child(1) .pill{background:var(--pink)}.journey li:nth-child(2) .pill{background:var(--orange)}
.journey li:nth-child(3) .pill{background:var(--light-blue)}.journey li:nth-child(4) .pill{background:var(--ochre)}
.journey .lbl{font-size:18px;letter-spacing:.04em;text-transform:uppercase}
.journey li[aria-current="step"] .lbl{text-decoration:underline;text-underline-offset:6px}

/* starting position */
.alt{background:var(--surface-alt);color:var(--ink-on-alt);--ink:var(--ink-on-alt);--line:var(--plum);--ink-muted:#6b4d53;--focus:var(--plum)}
.sp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:40px}
.sp{display:grid;gap:14px;padding:24px 28px;border:1px solid var(--line);border-radius:28px;min-width:0}
.sp .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sp .area{font-size:22px}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.scale span{height:10px;border-radius:999px;border:1px solid var(--line)}
.scale span.on{background:var(--plum)}
.sp .tag{font-family:var(--font-ui);font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.sp.pri{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.sp.pri .scale span{border-color:var(--cream)}.sp.pri .scale span.on{background:var(--cream)}
.legend{display:flex;flex-wrap:wrap;gap:8px 24px;margin-top:20px}

/* priorities */
.prio{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:32px}
.prio>div{min-width:0;display:grid;gap:8px}
.prio ul{margin:0;padding-left:18px}

/* practice cards */
.cards{display:grid;gap:16px;margin-top:40px}
.card{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:28px;padding:28px 32px;border-radius:var(--radius-card);background:var(--surface-alt);color:var(--plum)}
.card .meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--font-ui);font-size:12px;line-height:14px;letter-spacing:.03em;text-transform:uppercase;padding:5px 10px;border-radius:var(--radius-pill);border:1px solid currentColor}
.chip.ev-Foundation{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.card .what{font-size:26px;line-height:32px;margin-top:14px}
.card .dose{font-weight:400}
.card .det{margin-top:10px}
.why{margin-top:18px;padding-top:14px;border-top:1px solid var(--plum)}
.why b{display:block;font-family:var(--font-ui);font-weight:400;font-size:12px;letter-spacing:.03em;text-transform:uppercase;margin-bottom:6px}
.time{display:grid;align-content:start;gap:4px;border-left:1px solid var(--plum);padding-left:24px}
.time .n{font-weight:200;font-size:48px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.time .s{font-family:var(--font-ui);font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.light .card{background:transparent;color:var(--ink);border:1px solid var(--line)}
.light .card .why{border-color:var(--line)}.light .time{border-color:var(--line)}
.light .card .what{font-size:22px;line-height:28px}
.light .chip.ev-Foundation{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* time band */
.inv{background:var(--surface-inverse);color:var(--ink-inverse);--ink:var(--ink-inverse);--line:var(--ink-inverse)}
.tband{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:32px}
.tband div{display:grid;gap:6px;min-width:0}
.tband .n{font-weight:200;font-size:clamp(48px,7vw,68px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}

/* months */
.tbl{overflow-x:auto;margin-top:32px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;vertical-align:top;padding:14px 12px;border-top:1px solid var(--line)}
th{font-family:var(--font-ui);font-weight:400;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
td small{display:block;color:var(--ink-muted);font-size:14px;line-height:18px;margin-top:4px}
.ch{display:inline-block;font-family:var(--font-ui);font-size:11px;letter-spacing:.04em;padding:4px 10px;border-radius:var(--radius-pill);border:1px solid var(--line);margin-bottom:6px}
.ch.LEVEL{background:var(--button-fill);color:var(--button-ink);border-color:var(--button-fill)}
.ch.SWAP{background:var(--orange);color:var(--black);border-color:var(--orange)}
.outcomes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px}
.outcomes div{display:grid;gap:8px;align-content:start;justify-items:start}

/* themes, foundations */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px}
.two>div{min-width:0}
.list{list-style:none;margin:24px 0 0;padding:0;display:grid}
.list li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;padding-block:14px;border-top:1px solid var(--line)}
.box{width:18px;height:18px;border:1px solid var(--line);border-radius:4px;display:inline-block;vertical-align:-3px;margin-right:10px}
.own{margin-top:40px;padding:28px 32px;border-radius:var(--radius-card);background:var(--pink);color:var(--plum)}

.next{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:48px}
.next>div{display:grid;gap:12px;min-width:0}
.pilot{margin-top:24px;border:1px dashed var(--line);border-radius:28px;padding:20px 28px}
.pilot summary{cursor:pointer;font-family:var(--font-ui);font-size:13px;letter-spacing:.03em;text-transform:uppercase}
.pilot ul{margin:16px 0 0;padding-left:18px;display:grid;gap:8px}
.disc{padding-block:32px 56px;font-size:15px;line-height:22px}

@media (max-width:800px){
  .journey{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:28px}
  .sp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{grid-template-columns:minmax(0,1fr)}
  .time{border-left:0;border-top:1px solid var(--plum);padding-left:0;padding-top:16px}
  .prio,.two,.next,.tband,.outcomes{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){.sp-grid{grid-template-columns:minmax(0,1fr)}.list li{grid-template-columns:minmax(0,1fr);gap:4px}}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .35s ease both}@keyframes f{from{opacity:.4}to{opacity:1}}}

/* assessment */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding-block:16px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--font-ui);font-size:13px;letter-spacing:.03em;text-transform:uppercase;height:40px;padding:0 24px;border-radius:var(--radius-pill);border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--button-fill);color:var(--button-ink);border-color:var(--button-fill)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{height:32px;padding:0 14px;font-size:12px}
.examples{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:28px}
.steps button{font-family:var(--font-ui);font-size:12px;letter-spacing:.03em;text-transform:uppercase;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}
.steps button[aria-current="step"]{background:var(--button-fill);color:var(--button-ink);border-color:var(--button-fill)}
.steps button .ct{opacity:.7}
.qwrap{display:grid;gap:40px;padding-block:40px 64px;max-width:820px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:14px;min-width:0}
legend{font-size:24px;line-height:30px;padding:0;margin-bottom:6px}
.qn{font-family:var(--font-ui);font-size:12px;letter-spacing:.03em;display:block;margin-bottom:8px;color:var(--ink-muted)}
.hint{color:var(--ink-muted);font-size:16px;line-height:22px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--line);border-radius:16px;cursor:pointer;font-size:17px;line-height:22px}
.opt input{margin-top:3px;accent-color:var(--plum);width:18px;height:18px;flex:none}
.opt:has(input:checked){background:var(--surface-alt);color:var(--plum);border-color:var(--plum)}
.opt:has(input:disabled){opacity:.45}
.grid{overflow-x:auto}
.grid table{min-width:560px}
.grid td,.grid th{padding:10px 8px;font-size:15px;line-height:20px}
.grid td.c{text-align:center}
.grid input{accent-color:var(--plum);width:18px;height:18px}
.grid select{font:inherit;font-size:15px;padding:6px 8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:100%}
textarea{font:inherit;font-size:17px;width:100%;min-height:80px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.nav{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;padding-block:24px 64px;border-top:1px solid var(--line)}
.intro{padding-block:48px 0;display:grid;gap:16px;max-width:820px}
.intro h1{font-size:clamp(40px,6vw,60px)}
.pilotmode .pilot{border-style:solid}
.bar{}@media (max-width:700px){.bar{position:static}}
.refs{margin:24px 0 0;padding-left:18px;display:grid;gap:8px;font-size:14px;line-height:20px;color:var(--ink-muted);word-break:break-word}
.ch{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;border-radius:0;background:none!important;color:inherit!important;font-weight:600}
.ch::before{content:"";width:8px;height:8px;border-radius:50%;border:1px solid currentColor;flex:none}
.ch.LEVEL::before{background:var(--plum);border-color:var(--plum)}
.ch.SWAP::before{background:var(--orange);border-color:var(--orange)}
.nr{margin-top:16px;border-top:1px solid currentColor;padding-top:14px}
.linkbtn{font-family:var(--font-ui);font-size:12px;letter-spacing:.03em;text-transform:uppercase;background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.linkbtn:disabled{opacity:.5;cursor:not-allowed;text-decoration:none}
.nrpanel{display:grid;gap:12px;margin-top:12px}
.nrpanel fieldset{border:0;padding:0;margin:0;display:grid;gap:6px}
.nrpanel legend{font-size:17px;margin-bottom:6px}
.nrpanel .opt{background:var(--cream);color:var(--plum);border-color:var(--plum)}
.nropts{display:grid;gap:8px}
.nropt{display:grid;gap:6px;padding:14px 16px;border:1px solid currentColor;border-radius:16px}
.nropt .t{font-size:18px;line-height:24px}
.nrmsg{font-size:16px;line-height:22px}
.nrrow{display:flex;flex-wrap:wrap;gap:8px}
.req{display:inline-block;margin-top:12px;font-family:var(--font-ui);font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.nrcount{margin-top:16px}
.logo{height:18px;display:block}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
.notice{margin:0;padding:14px 18px;border-radius:16px;background:var(--surface-alt);color:var(--plum);border:1px solid var(--plum)}
fieldset.missing legend{color:var(--orange)}
fieldset.missing{border-left:3px solid var(--orange);padding-left:14px}
.nm{display:grid;gap:10px;font-size:20px}
.nm input{font:inherit;font-size:18px;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);max-width:420px}
.ex-note{font-family:var(--font-ui);font-size:12px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-muted)}
</style>

<div class="bar"><div class="wrap">
  <div class="brand"><img src="design/assets/tgs-logo-one-line-black.png" alt="The Good Span" class="logo"></div>
  <div class="examples"><button class="btn small" id="reset" type="button" hidden>Start again</button></div>
</div></div>

    <p class="disc muted">Your Good Span plan is designed to support everyday wellbeing and healthy habits. It's not a substitute for personalised medical care.</p></div></div>`;
  document.getElementById('edit').onclick = () => { REQ = {}; OPEN = null; CUR = null; mode = 'assess'; sec = 0; save(); render(); scrollTo(0, 0); };
  // Testing export: the member's answers and their plan (no Pilot notes: those are never shown to members).
  document.getElementById('dl').onclick = () => {
    const out = { member: { id: member.id, name: member.name, created: member.created, planned: member.planned }, answers: A,
      plan: { priorities: P.pri, startingPosition: P.status, weeklyTimeLimit: P.budget, newMinutes: P.minutes.map(Math.round),
        months: P.months.map((m, i) => ({ month: i + 1, practices: m.map(x => ({ role: x.role, pillar: x.area, practice: x.fam, level: x.row.l, text: `${x.row.w} ${x.row.d}.`, why: x.why, change: x.change || 'START', note: x.note || '' })) })),
        themes: P.themes.map(t => ({ pillar: t[0], theme: t[1] })), foundations: P.foundations.map(h => ({ pillar: h.p, text: h.t })) },
      notRightForMe: REQ };
    const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = `good-span-${member.id}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const v = document.getElementById('view'); v.onclick = e => nrHandle(e, P); v.onchange = e => nrHandle(e, P);
  if (!member.sent) { member.sent = true; save(); afterPlan(P); }
}
// ---------- testing: responses to the team's Google Sheet, and a saved copy of the plan ----------
// The sheet is internal (team and Pilots only). It receives the answers, the plan and the Pilot notes. Members never see Pilot notes.
const SHEET_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbzpXkKREskdbihrlUqHZNde2WYYoZQLgzONj0RDXQzH-qLuB3FLzIF7p4MUV9iVk8kfrg/exec";
const PLAN_SAVE_URLS = ["api/plans", "https://goodspan-longevity-map.saraportell.workers.dev/api/plans"];
const VERSION = 'October 2026 · 50 questions · rules 1–18';
function answerText(q, v) {
  if (v == null) return '';
  if (q.type === 'grid') return q.rows.map(r => `${r[1]}: ${v[r[0]] || '—'}`).join('; ');
  if (q.type === 'habit') return v.text ? `${v.text} (${v.choice || 'no choice'})` : '';
  return Array.isArray(v) ? v.join('; ') : String(v);
}
function sheetRow(P, source) {
  const row = { submittedAt: new Date().toISOString(), version: VERSION, memberRef: member.id, memberName: member.name || '', email: member.email || '', mobile: member.mobile || '', source };
  // one column per question, the same for every member: section + question text (questions that weren't shown stay blank)
  for (const q of QUESTIONS) { if (!visible(q)) continue; row[`v7 ${SECTIONS.find(x => x.id === q.s).title}: ${q.text}`] = answerText(q, A[q.id]); }
  if (P) {
    row.priorities = P.pri.join(', ');
    row.startingPosition = Object.entries(P.status).map(([a, s]) => a + ': ' + s).join('; ');
    row.weeklyLimit = P.budget; row.newMinutesMonth1 = Math.round(P.minutes[0]);
    row.month1 = P.months[0].map(x => `${x.role}: ${x.fam} (${x.row.l})`).join('; ');
    row.themes = P.themes.map(t => t[1]).join(', ');
    row.foundations = P.foundations.map(h => h.f).join(', ');
    row.pilotNotes = P.pilot.map(x => x[0] + ': ' + x[1]).join(' | ');
  }
  if (member.planLink) row.planLink = member.planLink;
  return row;
}
async function sendToSheet(row) {
  if (!SHEET_WEBHOOK_URL || location.protocol === 'file:') return;
  try { await fetch(SHEET_WEBHOOK_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(row) }); }
  catch (e) { console.error('Could not reach the Google Sheet', e); }
}
function planSnapshot() {
  // A static copy of the member's plan page: no scripts, no buttons, absolute links to fonts and images.
  const doc = document.documentElement.cloneNode(true);
  doc.querySelectorAll('script, .bar, .examples, .nr, .nrpanel, #edit, #dl').forEach(el => el.remove());
  doc.querySelectorAll('input').forEach(el => el.setAttribute('disabled', ''));
  let html = '<!doctype html>\n' + doc.outerHTML;
  const base = new URL('.', document.baseURI).href;
  return html.split('url("design/assets/').join('url("' + base + 'design/assets/').split('src="design/assets/').join('src="' + base + 'design/assets/');
}
async function savePlanCopy() {
  if (location.protocol === 'file:') return null;
  for (const u of PLAN_SAVE_URLS) {
    try {
      const res = await fetch(new URL(u, document.baseURI).href, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ planId: member.id.replace(/[^A-Za-z0-9_-]/g, ''), html: planSnapshot() }) });
      if (res.ok && (res.headers.get('content-type') || '').includes('json')) { const d = await res.json(); if (d.planLink) return d.planLink; }
    } catch (e) { /* try the next address */ }
  }
  return null;
}
async function afterPlan(P) {
  await sendToSheet(sheetRow(P, 'plan'));
  const link = await savePlanCopy();
  if (link) { member.planLink = link; save(); await sendToSheet({ memberName: member.name || '', email: member.email || '', memberRef: member.id, planLink: link }); if (mode === 'plan') { const y = scrollY; render(); scrollTo(0, y); } }
}
function renderWelcome() {
  const resume = member && Object.keys(A).length;
  document.getElementById('view').innerHTML = `<div class="wrap"><div class="intro welcome">
    <h1>Welcome.</h1>
    <p class="lead">This 15-minute assessment explores six pillars of longevity: Nutrition, Sleep, Movement, Mind, Connection and Prevention.</p>
    <p class="lead">Your answers will help us create a personalised Good Span, with practices tailored to you and clear explanations of why each one is recommended.</p>
    ${resume ? `<p>You have an assessment in progress${member.name ? ' for ' + esc(member.name) : ''}.</p>
      <div class="nav" style="border:0;padding-top:0"><button class="btn primary" type="button" id="cont">Continue where I left off</button><button class="btn" type="button" id="fresh">Start a new assessment</button></div>`
    : `<form id="wform" class="qwrap" style="padding-block:8px 0" novalidate><label class="nm"><span>What would you like us to call you?</span>
      <input id="nm" type="text" autocomplete="given-name" maxlength="40" placeholder="Your first name" value="${esc(member && member.name || '')}"></label>
      <label class="nm"><span>Email</span><input id="em" type="email" autocomplete="email" inputmode="email" maxlength="120" placeholder="you@example.com"></label>
      <label class="nm"><span>Mobile</span><input id="mo" type="tel" autocomplete="tel" inputmode="tel" maxlength="30" placeholder="Your mobile number"></label></form>
      <div class="nav" style="border:0"><span></span><button class="btn primary" type="button" id="go">Start</button></div>`}
  </div></div>`;
  const go = document.getElementById('go');
  if (go) { const start = () => { member = newMember(); member.name = document.getElementById('nm').value.trim(); member.email = document.getElementById('em').value.trim(); member.mobile = document.getElementById('mo').value.trim(); A = {}; REQ = {}; sec = 0; mode = 'assess'; save(); render(); scrollTo(0, 0); };
    go.onclick = start; document.getElementById('wform').addEventListener('submit', e => { e.preventDefault(); start(); }); }
  const c = document.getElementById('cont'); if (c) c.onclick = () => { mode = member.done ? 'plan' : 'assess'; save(); render(); };
  const fr = document.getElementById('fresh'); if (fr) fr.onclick = () => { member = null; A = {}; REQ = {}; sec = 0; mode = 'welcome'; save(); render(); };
}
function render() {
  document.getElementById('reset').style.display = mode === 'welcome' ? 'none' : '';
  if (mode === 'plan' && member) { if (!member.planned) { member.planned = new Date().toISOString(); } member.done = true; save(); }
  if (mode === 'plan') renderPlan(); else if (mode === 'assess') renderAssess(); else renderWelcome();
}
document.getElementById('reset').onclick = () => {
  if (!confirm('Start a new assessment? Your current answers on this device will be cleared.')) return;
  REQ = {}; OPEN = null; CUR = null; A = {}; sec = 0; member = null; mode = 'welcome'; tried = false; save(); render(); scrollTo(0, 0);
};
if (!member) mode = 'welcome';
render();
</script>
