<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Good Span — Registration Closed</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root { --bg:#FAFAF8; --card:#fff; --ink:#20251F; --muted:#5A5F56; --accent:#2C4636; }
    * { box-sizing: border-box; }
    html,body { height: 100%; margin: 0; font-family: -apple-system,BlinkMacSystemFont,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { min-height: 100%; display: grid; place-items: center; padding: 24px; }
    .card { max-width: 720px; width: 100%; background: var(--card); border: 1px solid #E9E7DC; border-radius: 20px; padding: clamp(24px,4vw,40px); box-shadow: 0 30px 70px -30px rgba(22,38,28,0.12); }
    h1 { margin: 0 0 12px; font-size: clamp(22px,3vw,28px); font-weight: 650; letter-spacing: -0.01em; }
    p { margin: 0; font-size: 16px; line-height: 1.6; color: var(--muted); }
    .brand { display:flex; align-items:center; gap:10px; margin-bottom: 14px; color: var(--accent); font-weight: 700; }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-labelledby="closure-title">
      <div class="brand" aria-hidden="true">The Good Span</div>
      <h1 id="closure-title">Registration closed</h1>
      <p>Registration for the Good Span starting on 14 September is now closed. If you have any questions or would like to join a future Span, please contact the Good Span team.</p>
    </section>
  </main>
</body>
</html>
