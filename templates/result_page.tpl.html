<title>Good Span Result Page</title>
<style>
/* Layout: one calm column, one screen at a time, seven steps from Starting Position to choosing support. Brand tokens from The Good Span visual identity (Oct 2026). */
@font-face{font-family:"BST Bazaine";src:url(__F_THIN__) format("opentype");font-weight:200;font-display:swap}
@font-face{font-family:"BST Bazaine";src:url(__F_LIGHT__) format("opentype");font-weight:300;font-display:swap}
@font-face{font-family:"BST Bazaine";src:url(__F_REG__) format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Archivo";src:url(__F_UI__) format("truetype");font-weight:400;font-display:swap}
:root{
  --plum:#4D2831;--cream:#FFF2EA;--orange:#FE600C;--blue:#D1E6E9;--pink:#F5A4C2;--ochre:#CB863A;--black:#000;--white:#FFF;
  --ink:var(--plum);--muted:#7A5A5F;--line:rgba(77,40,49,.22);--bg:var(--cream);--card:var(--white);
  --display:"BST Bazaine","Helvetica Neue",Arial,sans-serif;--ui:"Archivo","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--display);font-weight:300;font-size:17px;line-height:1.5;padding-inline:16px}
.shell{max-width:880px;margin:0 auto;padding-block:20px 48px;display:grid;gap:28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--plum)}
.top img{height:18px;width:auto;display:block}
.who{display:flex;gap:6px;flex-wrap:wrap}
.ui,.who button,.btn,.kicker,.chip,.dots span{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.who button{background:transparent;color:var(--ink);border:1px solid var(--plum);border-radius:999px;padding:6px 12px;cursor:pointer}
.who button[aria-pressed="true"]{background:var(--plum);color:var(--cream)}
.progress{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots button{width:28px;height:28px;border-radius:50%;border:1px solid var(--plum);background:transparent;color:var(--ink);font-family:var(--ui);font-size:11px;cursor:pointer;padding:0}
.dots button[aria-current="step"]{background:var(--plum);color:var(--cream)}
.dots button.done{border-style:dashed}
.kicker{color:var(--muted);margin:0}
h1,h2,h3{font-weight:200;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,5vw,46px);line-height:1.08;letter-spacing:-.01em}
h2{font-size:clamp(24px,3.4vw,30px);line-height:1.15;font-weight:300}
h3{font-size:20px;line-height:1.25;font-weight:400}
p{margin:0;max-width:62ch}
.lead{font-size:19px;line-height:1.5}
.screen{display:grid;gap:24px;min-width:0}
.jump{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);scrollbar-width:none}
.jump a{flex:none;font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:6px 11px}
.jump a[aria-current]{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.jump a:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
#screens{display:grid;gap:64px}
.screen{scroll-margin-top:64px}
.screen+.screen{padding-top:8px}
h2.sh{font-size:clamp(26px,3.6vw,34px);line-height:1.12;font-weight:200}

.screen[hidden]{display:none!important}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid var(--line)}
.btn{border-radius:999px;padding:12px 22px;border:1px solid var(--plum);background:transparent;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--plum);color:var(--cream)}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,.btn:focus-visible{outline:2px solid var(--plum);outline-offset:3px}
/* map */
.pos{display:grid;border-top:1px solid var(--plum)}
.prow{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.pl{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pcs{display:flex;flex-wrap:wrap;gap:8px}
.pc{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:6px 12px;border:1px solid var(--plum)}
.g-improve .pc{border-style:dashed}
.g-focus .pc{border-color:transparent}
.pc sup{font-size:9px;margin-left:2px}
@media (max-width:520px){.prow{grid-template-columns:minmax(0,1fr);gap:8px}}
.node{display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.node svg{width:min(118px,100%);height:auto;display:block}
.node .nm{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.node .st{font-size:14px;color:var(--muted);line-height:1.3}
.legend{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:14px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:8px}
.note{font-size:14px;color:var(--muted)}
/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.card{border-radius:24px;padding:22px;display:grid;gap:10px;align-content:start;min-width:0}
.hero{background:var(--plum);color:var(--cream);border-radius:24px;padding:clamp(24px,5vw,44px);display:grid;gap:18px}
.hero h1{color:var(--cream)}
.hk{color:var(--blue)}
.hl{color:var(--blue);font-size:18px;line-height:1.55;max-width:60ch}
.sp{display:grid;gap:12px;margin-top:10px;padding-top:20px;border-top:1px solid rgba(209,230,233,.35)}
.sph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 18px;align-items:baseline}
.spl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 6px;font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.k{display:inline-block;width:12px;height:12px;border-radius:50%;margin-left:10px}.k:first-child{margin-left:0}
.k-focus{background:var(--cream)}.k-improve{border:1px dashed var(--cream)}.k-well{border:1px solid var(--cream)}
.strip{list-style:none;margin:0;padding:4px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.seg{border-radius:16px;padding:12px 12px 14px;display:grid;gap:4px;min-width:0}
.seg .sn{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;overflow-wrap:anywhere}
.seg .ss{font-size:14px;line-height:1.25}
/* every tile in its pillar colour; focus tiles carry a cream ring, worth-improving a dashed one */
.seg.s-focus{outline:2px solid var(--cream);outline-offset:2px}
.seg.s-improve{outline:1.5px dashed var(--cream);outline-offset:2px}
.hn{font-size:13px;color:var(--blue)}
.brief{display:grid;border-top:1px solid var(--plum)}
.bp{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:20px 22px;border-bottom:1px solid var(--line)}
.bh{display:grid;gap:8px;align-content:start;justify-items:start}
.bh h3{font-size:22px;font-weight:300}
.bp p{font-size:17px;line-height:1.6}
.tag{font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:4px 10px;border:1px solid var(--plum)}
.t-improve{border-style:dashed}.t-focus{border-color:transparent}
.suits{font-size:17px;color:var(--muted)}
@media (max-width:860px){.strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}.bp{grid-template-columns:minmax(0,1fr);gap:10px}.bh{display:flex;gap:10px;align-items:center}}

.bl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:18px;align-items:baseline;padding:18px 22px;border-radius:20px;background:var(--white)}
.bl dt{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bl dd{margin:0;font-size:19px;line-height:1.45}
.b-int{background:var(--pink)}.b-well{background:var(--blue)}.b-impr{background:transparent;border:1px dashed var(--plum)}
.c-well{background:var(--blue)}.c-impr{background:var(--white);border:1px dashed var(--plum)}.c-int{background:var(--pink)}
.focus{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.focus.one{grid-template-columns:minmax(0,1fr)}
.fcard{background:var(--white);border-radius:24px;padding:24px;display:grid;gap:12px;min-width:0}
.fcard ul{margin:0;padding-left:18px;display:grid;gap:8px}
.chip{display:inline-block;border-radius:999px;padding:4px 10px;justify-self:start}
.p-Nutrition{background:var(--orange);color:var(--black)}.p-Sleep{background:var(--cream);color:var(--black);box-shadow:inset 0 0 0 1px var(--plum)}.p-Movement{background:var(--pink);color:var(--black)}
.p-Mind{background:var(--ochre);color:var(--black)}.p-Connection{background:var(--plum);color:var(--cream)}.p-Prevention{background:var(--black);color:var(--cream)}
.next{display:grid;gap:16px;padding:24px;border-radius:24px;border:1px solid var(--plum)}
.nh{display:grid;gap:6px}
.ng{display:grid;gap:10px}
.ng ol{margin:0;padding-left:20px;display:grid;gap:10px}
.ng li span{display:block;font-size:15px;color:var(--muted)}
.ng li b{font-weight:400}
.later{display:grid;gap:10px;padding:20px 22px;border-radius:24px;border:1px dashed var(--plum)}
.later ul{margin:0;padding-left:18px;display:grid;gap:6px}
/* practices */
.prs{display:grid;gap:14px}
.pr{background:var(--white);border-radius:24px;padding:24px;display:grid;gap:14px;min-width:0}
.pr .act{font-size:22px;line-height:1.3;font-weight:300}
.pr .act b{font-weight:400}
.pr dl{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 18px}
.pr dt{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.pr dd{margin:0}
details{border-top:1px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
details p{margin-top:8px;font-size:15px;color:var(--muted)}
.check{background:var(--blue);border-radius:24px;padding:22px 24px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start}
.check svg{width:44px;height:44px}
/* fit */
.fit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.stat{background:var(--white);border-radius:24px;padding:22px;display:grid;gap:6px;align-content:start}
.stat .n{font-size:44px;font-weight:200;line-height:1;font-variant-numeric:tabular-nums}
.fitlist{margin:0;padding-left:18px;display:grid;gap:8px}
/* roadmap */
.road{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.road li{display:grid;gap:8px;padding:0 10px 0 0;position:relative;min-width:0;align-content:start}
.road li::before{content:"";height:1px;border-top:1px solid var(--plum);position:absolute;left:22px;right:0;top:11px}
.road li:last-child::before{display:none}
.road .pt{width:22px;height:22px;border-radius:50%;border:1px solid var(--plum);background:var(--bg);position:relative;z-index:1}
.road li.now .pt{background:var(--plum);border-color:var(--plum)}
.road li.end .pt{background:var(--plum)}
.road .when{font-family:var(--ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.road .what{font-size:18px;font-weight:400}
.road p{font-size:14px;line-height:1.35}
/* offer */
.close{background:var(--plum);color:var(--cream);border-radius:24px;padding:32px 28px;display:grid;gap:10px}
.close h2{font-weight:200}
.close p{color:var(--blue)}
.incl{display:grid;gap:10px}
.incl ul{margin:0;padding-left:18px;columns:2;column-gap:32px}
.incl li{break-inside:avoid;margin-bottom:6px}
.tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.tier{background:var(--white);border-radius:24px;padding:24px;display:grid;gap:12px;min-width:0;border:1px solid transparent}
.tier.sel{border-color:var(--plum)}
.tier .price{font-size:34px;font-weight:200;line-height:1}
.tier .price small{font-size:15px;font-weight:300}
.tier ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:15px}
.tier p{font-size:15px;line-height:1.45}
.tier .tag{font-size:15px;font-weight:400}
.trial{font-size:14px;color:var(--muted)}
@media (max-width:760px){
  .grid3,.focus,.fit,.tiers{grid-template-columns:minmax(0,1fr)}
  .road{grid-template-columns:minmax(0,1fr);gap:18px}
  .road li{grid-template-columns:22px minmax(0,1fr);column-gap:14px;padding:0}
  .road li>*:not(.pt){grid-column:2}
  .road li .pt{grid-row:1/span 3}
  .road li::before{left:11px;top:22px;bottom:-18px;right:auto;width:0;height:auto;border-top:0;border-left:1px solid var(--plum)}
  .pr dl{grid-template-columns:minmax(0,1fr);gap:4px}
  .bl{grid-template-columns:minmax(0,1fr);gap:6px}
  .pr dd{margin-bottom:8px}
  .incl ul{columns:1}
}

/* ---- colour pass: colour-on-colour blocks and open arcs, per the identity guidelines ---- */
/* pillar colours as on the website: Nutrition orange, Sleep cream, Movement pink, Mind ochre, Connection plum, Prevention black */
.a-Nutrition{--pc:var(--orange);--pt:#000}.a-Sleep{--pc:var(--cream);--pt:#000}.a-Movement{--pc:var(--pink);--pt:#000}
.a-Mind{--pc:var(--ochre);--pt:#000}.a-Connection{--pc:var(--plum);--pt:var(--cream)}.a-Prevention{--pc:var(--black);--pt:var(--cream)}
.bp.g-focus.a-Sleep,.fcard.a-Sleep,.pr.a-Sleep{border:1px solid var(--plum)}
.pr.a-Sleep .hd{border-bottom:1px solid var(--plum)}
.seg.p-Connection{box-shadow:inset 0 0 0 1px var(--cream)}
.seg.p-Sleep{box-shadow:none}
.arcs{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit}
.arcs svg{position:absolute;display:block}
.hero,.close,.roadwrap,.fcard,.pr .hd,.stat,.nextwrap{position:relative;isolation:isolate}
.hero>*:not(.arcs),.close>*:not(.arcs),.roadwrap>*:not(.arcs),.fcard>*:not(.arcs),.pr .hd>*:not(.arcs),.stat>*:not(.arcs),.nextwrap>*:not(.arcs){position:relative;z-index:1}
.hero .hl{color:var(--cream);max-width:50ch}
.hero h1{max-width:14ch}
.fcard{align-content:start}
.stat .note{max-width:88%}
.close p{max-width:44ch}
.nextwrap .nh{max-width:80%}
.ng{align-content:start;justify-items:start}
.ng ol{justify-self:stretch}
@media (max-width:520px){.arcs svg{transform:translate(-30%,-62%) scale(.5)!important}.hero .arcs svg:nth-child(2){display:none}.nextwrap .nh{max-width:none}}
.seg .dot{width:10px;height:10px;border-radius:50%;background:var(--pc);display:inline-block;margin-right:6px;vertical-align:1px}
.s-focus .dot{display:none}
/* brief */
.bh h3{display:flex;align-items:center;gap:10px}
.bh h3::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--pc);box-shadow:inset 0 0 0 1px rgba(77,40,49,.35);flex:none}
.bp.g-focus{background:var(--pc);color:var(--pt);border-radius:24px;padding:22px 22px;border-bottom:0;margin:10px 0}
.bp.g-focus .bh h3::before{background:transparent;box-shadow:inset 0 0 0 1.5px currentColor}
.bp.g-focus .tag{border-color:currentColor;background:transparent;color:inherit}
.bp.g-focus+.bp:not(.g-focus){border-top:0}
/* focus cards */
.fcard{background:var(--pc);color:var(--pt);padding:28px;overflow:hidden;min-height:220px}
.fcard .chip{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.fcard .fh{font-size:clamp(28px,3.6vw,36px);font-weight:200;line-height:1.05}
.later{background:var(--blue);border:0}
.later.dashed{background:transparent;border:1px dashed var(--plum)}
/* practices */
.pr{padding:0;overflow:hidden;gap:0}
.pr .hd{background:var(--pc);color:var(--pt);padding:24px 24px 26px;display:grid;gap:12px;overflow:hidden}
.pr .hd .chip{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px currentColor}
.pr .act{font-size:24px;max-width:30ch}
.pr .bd{padding:22px 24px 24px;display:grid;gap:14px}
.pr .num{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.nextwrap{background:var(--plum);color:var(--cream);border-radius:24px;padding:28px;display:grid;gap:20px;overflow:hidden}
.nextwrap .note{color:var(--blue)}
.nextwrap .ng li span{color:var(--blue)}
.nextwrap .chip.p-Connection{box-shadow:inset 0 0 0 1px var(--cream)}
.nextwrap .chip.lt{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 1px var(--cream)}
.nextwrap .ngs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px 28px}
/* fit */
.stat{overflow:hidden;min-height:190px}
.st-1{background:var(--plum);color:var(--cream)}.st-2{background:var(--blue);color:var(--plum)}.st-3{background:var(--white);color:var(--plum)}
.stat .note{color:inherit;opacity:.85}
.stat .n{font-size:56px}
/* roadmap */
.roadwrap{background:var(--plum);color:var(--cream);border-radius:24px;padding:clamp(24px,4vw,40px);display:grid;gap:28px;overflow:hidden}
.roadwrap .road li::before{border-color:var(--cream);border-top-style:dashed}
.roadwrap .road .pt{background:var(--plum);border-color:var(--cream)}
.roadwrap .road li.now .pt{background:var(--cream);border-color:var(--cream)}
.roadwrap .road li.mid .pt{background:var(--blue);border-color:var(--blue)}
.roadwrap .road li.end .pt{background:var(--blue);border-color:var(--blue)}
.roadwrap .road .when{color:var(--blue)}
.roadwrap .later{background:rgba(255,242,234,.08);border:1px dotted rgba(255,242,234,.6);color:var(--cream)}
.roadwrap .later .kicker{color:var(--blue)}
/* close and tiers */
.close{background:var(--blue);color:var(--plum);overflow:hidden;padding:clamp(28px,5vw,48px)}
.close p{color:var(--plum)}
.close h2{font-size:clamp(30px,4.4vw,44px)}
.tier{border:1px solid var(--plum)}
.tier.t-Core{background:var(--orange);color:#000;border-color:var(--orange)}
.tier.t-Core .note,.tier.t-Core .ui{color:#000}
.tier.t-Core .tag{border-color:#000}
.tier.t-Core .btn.primary{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.tier.t-Concierge{background:var(--plum);color:var(--cream);border-color:var(--plum)}
.tier.t-Concierge .ui{color:var(--blue)}
.tier.t-Concierge .btn{background:var(--blue);color:var(--plum);border-color:var(--blue)}
.tier.t-Self{background:var(--white);border-color:var(--white)}
.tier.sel{outline:2px solid var(--plum);outline-offset:3px}
.incl{background:var(--white);border-radius:24px;padding:24px}
@media (max-width:760px){.roadwrap .road li::before{border-top:0;border-left:1px dashed var(--cream)}}

/* equal sizes: focus cards share one height in every layout; membership tiers share one height, buttons on one line */
.focus{grid-auto-rows:1fr;align-items:stretch}
.tiers{align-items:stretch}
.tier{display:flex;flex-direction:column;gap:12px}
.tier .tag{align-self:flex-start}
.tier .btn{margin-top:auto}
.tier .trial{margin-top:auto;padding-top:4px}
.tier .trial+.btn{margin-top:0}
@media (max-width:760px){.tiers{align-items:start}.tier .btn{margin-top:8px}}
.ht{display:grid;gap:6px}
.hsub{font-size:clamp(20px,2.6vw,26px);font-weight:200;line-height:1.2;color:var(--blue);margin:0}
.hls{display:grid;gap:12px}
.ht .kicker{margin-top:4px}
/* opening block on light blue */
.hero{background:var(--blue);color:var(--plum)}
.hero h1,.hero .hl,.hero .hk,.hero .hn,.hero .hsub,.hero .ss{color:var(--plum)}
.hero .p-Connection .ss,.hero .p-Prevention .ss{color:var(--cream)}
.hero .sp{border-top-color:rgba(77,40,49,.3)}
.hero .seg.s-focus{outline-color:var(--plum)}
.hero .seg.s-improve{outline-color:var(--plum)}
.hero .seg.p-Connection{box-shadow:none}
.secsub{font-size:clamp(20px,2.6vw,24px);font-weight:200;line-height:1.2;margin:-14px 0 0}
/* opening with photo */
.hero{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:clamp(24px,4vw,44px);align-items:center}

      <div class="tier t-Core" data-t="Core"><span class="ui">Core</span><span class="price">€129<small>/month</small></span><span class="pterm" aria-hidden="true">&nbsp;</span><p class="tl">Personal guidance to keep you moving forward.</p>

      <div class="tier t-Concierge" data-t="Concierge"><span class="ui">Concierge</span><span class="price">€249<small>/month</small></span><span class="pterm" aria-hidden="true">&nbsp;</span><p class="tl">More individual attention, coordinated around you.</p>

    </div>
    <div class="pcta pcta2"><button class="btn pbtn" type="button">Book my Good Span Review</button><p class="pmeta">Or decide with your Pilot · 20 minutes · online</p></div>
    <div class="dlbox"><div><h3>Keep your Good Span</h3><p>Download your plan to read again, print or share with your Pilot.</p></div><button class="btn dlbtn" type="button" data-dl="1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>Download my Good Span</button><p class="dlmsg" role="status"></p></div>`
];
// the opening and the Starting Position share the first screen
const S = [r => S0[0](r) + '<div class="spos">' + S0[1](r).replace('<h1>', '<h2 class="sh">').replace('</h1>', '</h2>') + '</div>', ...S0.slice(2)];

// progressive disclosure: one section at a time, in order. Earlier sections can be revisited from the step bar.
const STEPNAMES = r => ['Your Good Span', 'Where to focus', 'Your month ahead', 'Your six-month journey', 'Choose how to continue', 'Membership options'];
let seen = 0, back = null;   // furthest step reached; where to return after a jump to the references
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function render() {
  const r = D[who];
  document.getElementById('who').hidden = D.length < 2;
  document.getElementById('who').innerHTML = D.map((m, i) => `<button type="button" aria-pressed="${i === who}" data-w="${i}">${esc(m.name)}</button>`).join('');
  document.getElementById('screens').innerHTML = S.map((f, k) => `<section class="screen" id="sec-${k + 1}" aria-labelledby="sh-${k + 1}" hidden>${(k ? f(r).replace(/<h1>/, `<h2 class="sh" id="sh-${k + 1}" tabindex="-1">`).replace(/<h1>/g, '<h2 class="sh">').replace(/<\/h1>/g, '</h2>') : f(r).replace('<h1>', `<h1 id="sh-${k + 1}" tabindex="-1">`))}</section>`).join('');
  // sections whose heading is an h2 already (Meet your Pilot, references) get the id on that heading
  document.querySelectorAll('.screen').forEach((sec, k) => { if (!sec.querySelector('#sh-' + (k + 1))) { const h = sec.querySelector('h1,h2'); if (h) { h.id = 'sh-' + (k + 1); h.tabIndex = -1; } } });
  show(step, true);
}
function show(k, quiet) {
  const r = D[who], names = STEPNAMES(r), n = S.length;
  step = Math.max(0, Math.min(n - 1, k)); seen = Math.max(seen, step);
  document.querySelectorAll('.screen').forEach((sec, i) => { sec.hidden = i !== step; });
  const nav = `<nav class="stepnav" aria-label="Your Good Span, section by section">
    ${back !== null ? `<button type="button" class="btn ghost" data-go="${back}">Back to where you were</button>` : step > 0 ? `<button type="button" class="btn ghost" data-go="${step - 1}">Back</button>` : '<span></span>'}
    ${step < n - 1 ? `<button type="button" class="btn next" data-go="${step + 1}">${step + 1 === n - 1 ? 'Explore membership options' : esc(names[step + 1])} →</button>` : `<button type="button" class="btn ghost" data-go="0">Back to the beginning</button>`}</nav>`;
  document.querySelectorAll('.stepnav').forEach(x => x.remove());
  document.getElementById('sec-' + (step + 1)).insertAdjacentHTML('beforeend', nav);
  document.getElementById('steps').innerHTML = `<ol class="sbar">${names.map((t, i) => `<li class="${i < step ? 'done' : i === step ? 'now' : ''}">${i <= seen ? `<button type="button" data-go="${i}" aria-label="${esc(t)}"${i === step ? ' aria-current="step"' : ''}></button>` : `<span aria-hidden="true"></span>`}</li>`).join('')}</ol><p class="sname"><span>${step + 1} of ${n}</span> ${esc(names[step])}</p>`;
  if (!quiet) { scrollTo({ top: 0, behavior: reduceMotion() ? 'auto' : 'smooth' }); const h = document.getElementById('sh-' + (step + 1)); if (h) h.focus({ preventScroll: true }); }
}
// download: the plan itself (opening, Starting Position, focus, month ahead and journey) as one file the member keeps.
// The file opens in any browser, offline, with every section and reference shown, and a button to print or save as PDF.
function planFile(r) {
  const css = [...document.querySelectorAll('style')].map(x => x.textContent).join('\n');
  const body = S.slice(0, 4).map((f, k) => `<section class="screen">${k ? f(r).replace(/<h1>/g, '<h2 class="sh">').replace(/<\/h1>/g, '</h2>') : f(r)}</section>`).join('').replace(/<details/g, '<details open');
  const logo = document.querySelector('.top img').src;
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Good Span · ${esc(r.name)}</title><style>${css}
    .screen{animation:none}#screens{gap:56px}.printbar{display:flex;justify-content:center;margin:8px 0 0}
    @page{size:A4;margin:14mm 12mm}
    @media print{.printbar{display:none}html,body{background:#fff!important;padding:0}.shell{max-width:none;padding:0}#screens{gap:28px}
      .screen,.roadwrap,.road,.road li,.fstack,.prs{break-inside:auto;overflow:visible!important}
      .hero,.bp,.fcard,.road.vroad li.js,.later,.check,.map,.jref,.srcs li,.pr .hd,.pr dl>*{break-inside:avoid}
      .pr{break-inside:auto}h1,h2,h3,.sh{break-after:avoid}
      *{-webkit-print-color-adjust:exact;print-color-adjust:exact;animation:none!important}
      #screens,.screen,.spos,.prs,.fstack,.roadwrap,.road,.road.vroad{display:block!important}
      .screen>*,.spos>*,.prs>*,.fstack>*,.roadwrap>*{margin-bottom:16px}
      .pr dl{display:block!important}.pr dt{margin-top:12px}.pr dd{margin:4px 0 0}
      .road.vroad>li{display:block!important;position:relative;padding:0 0 0 38px!important;margin:0 0 20px}
      .road.vroad>li>.pt{position:absolute;left:0;top:2px}.road.vroad>li::before{display:none!important}
      .road.vroad li.js{display:block!important;padding:14px 16px!important;margin:10px 0!important;position:static}
      .road.vroad li.js>b,.road.vroad li.js>span:not(.chip),.road.vroad li.js>.jref{display:block;margin-top:6px}}</style></head>
    <body><div class="shell"><header class="top"><img src="${logo}" alt="The Good Span"></header>
    <div class="printbar"><button class="btn dlbtn" type="button" onclick="window.print()">Print or save as PDF</button></div>
    <main id="screens">${body}</main></div></body></html>`;
}
async function downloadPlan(btn) {
  const r = D[who], name = `Good Span - ${r.name}.html`, html = planFile(r), msg = btn.parentElement.querySelector('.dlmsg');
  const say = t => { if (msg) msg.textContent = t; };
  let dl = null;
  try { dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (err) { dl = null; }
  if (dl) {
    try { await dl.save({ filename: name, data: html }); say('Saved. Open the file in any browser, or print it as a PDF.'); }
    catch (err) { if (err && err.code !== 'declined') say("Sorry, the download isn't available here."); }
    return;
  }
  try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' })); a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); say('Downloaded. Open the file in any browser, or print it as a PDF.'); }
  catch (err) { say("Sorry, the download isn't available here."); }
}
document.addEventListener('click', e => {
  const dlb = e.target.closest('[data-dl]'); if (dlb) { downloadPlan(dlb); return; }
  const refs = open => { const m = document.getElementById('refmore'), b = document.querySelector('.reft'); if (!m || !b) return; m.hidden = !open; b.setAttribute('aria-expanded', open); b.textContent = open ? 'Show fewer references' : 'Show all references'; };
  if (e.target.closest('a[href="#references"]')) { e.preventDefault(); back = step; show(S.length - 1); refs(true); return; }
  const rt = e.target.closest('.reft'); if (rt) refs(rt.getAttribute('aria-expanded') !== 'true');
  const g = e.target.closest('[data-go]'); if (g) { const to = +g.dataset.go; back = null; show(to); return; }
  const w = e.target.closest('[data-w]'); if (w) { who = +w.dataset.w; step = 0; seen = 0; back = null; render(); scrollTo(0, 0); }
});
document.addEventListener('keydown', e => { if (e.target.closest('input,textarea,select,summary')) return; if (e.key === 'ArrowRight' && step < S.length - 1) { back = null; show(step + 1); } if (e.key === 'ArrowLeft' && step > 0) { back = null; show(step - 1); } });
render();
</script>
